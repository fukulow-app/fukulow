[graph]
# Default features alone would let an optional forbidden dependency escape the graph.
all-features = true

[bans]
# Keep the workspace's internal edges within the diagram in
# docs/architecture/overview.md. Cargo rejects only cycles, so domain depending on
# protocol would otherwise build. Each entry allows only the listed direct parents;
# an allowed edge need not be present. Dev-dependencies are checked too.
# A new workspace member without an entry is unrestricted as a dependency: add its
# entry here when adding the member, or forbidden edges to it will go unchecked.
deny = [
    { crate = "protocol", wrappers = ["app", "realtime"] },
    { crate = "domain", wrappers = ["app", "db", "auth", "realtime"] },
    { crate = "db", wrappers = ["app", "auth"] },
    { crate = "auth", wrappers = ["app"] },
    { crate = "realtime", wrappers = ["app"] },
]

[licenses]
# MIT and Apache-2.0 cover the common licences in this dependency tree.
# matchit's MIT AND BSD-3-Clause requires both identifiers.
# unicode-ident's (MIT OR Apache-2.0) AND Unicode-3.0 requires Unicode-3.0 too.
# ISC arrives with rustls (ring is Apache-2.0 AND ISC; rustls-webpki and untrusted
# are ISC only) and Zlib with foldhash under sqlx's hashbrown. Both are short
# permissive licences of the MIT kind, and neither has an alternative on offer.
# webpki-roots (CDLA-Permissive-2.0) is avoided rather than allowed: sqlx uses the
# operating system's trust store instead, so certificate updates follow the OS.
# Any further identifier requires a deliberate review when the dependency tree changes.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "ISC", "Zlib"]
