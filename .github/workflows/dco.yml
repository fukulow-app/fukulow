# Every commit must carry a Signed-off-by line (DCO). There is no CLA, so this
# check is the whole of the agreement and it has to actually run.
#
# It verifies the commits a pull request adds, not the branch tip: a branch can
# be signed off at the tip and carry unsigned commits underneath.
#
# Dependabot's commits carry no sign-off. They are skipped only when the pull
# request was opened by Dependabot AND the commit's author name and email are both
# Dependabot's. The pull request's author cannot be forged, so nobody outside the
# repository can use this. The commit's author can: only people with write access
# can push to a Dependabot branch, and one of them could write Dependabot's name
# and email into their own commit. This exemption therefore trusts maintainers --
# which the DCO check does not protect against in any case.
name: dco

on:
  pull_request:

# Declared rather than inherited: the repository default can be read-write, and
# can be changed in settings without this file changing. The check only reads
# commits.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-off-by:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge-base is needed to list the commits this PR adds.
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit in this pull request is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          dependabot_name='dependabot[bot]'
          dependabot_email='49699333+dependabot[bot]@users.noreply.github.com'
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if [ "$PR_AUTHOR" = "$dependabot_name" ] \
               && [ "$(git show -s --format='%an' "$sha")" = "$dependabot_name" ] \
               && [ "$(git show -s --format='%ae' "$sha")" = "$dependabot_email" ]; then
              echo "$sha by Dependabot, in a pull request Dependabot opened: skipped"
              continue
            fi
            if ! git show -s --format='%B' "$sha" \
                 | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "::error::$sha by $author has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign commits off with: git commit -s"
            echo "To fix a branch: git rebase --signoff $BASE"
            exit 1
          fi
          echo "All commits are signed off."
