[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/protocol",
    "crates/domain",
    "crates/db",
    "crates/auth",
    "crates/realtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fukulow-app/fukulow"

[workspace.dependencies]
# Workspace members. Cargo rejects a cycle, so reversing an existing edge fails to
# build. It does not reject a new edge that forms no cycle -- domain depending on
# protocol builds, and is still forbidden. deny.toml holds the allowed list, checked
# by the audit job; docs/architecture/overview.md shows the direction.
protocol = { path = "crates/protocol" }
domain = { path = "crates/domain" }
db = { path = "crates/db" }
auth = { path = "crates/auth" }
realtime = { path = "crates/realtime" }

# Registry crates. Versions live here and members inherit them, so a version is
# never raised in one crate and left behind in another.
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "net",
    # Shutdown is a signal handler, not a Ctrl-C helper: containers send SIGTERM,
    # and a process that only listens for SIGINT is killed rather than stopped.
    "signal",
    "time",
] }
# `ws` is not enabled. Nothing serves a WebSocket until #6, and a feature turned
# on before its first use cannot be told apart from one that is needed.
axum = "0.8"
# `cookie` only: parsing the Cookie header and building Set-Cookie. Signed and
# private cookies are not enabled -- the session token is opaque and looked up by
# its hash, so there is nothing to sign. Default features are off: they add
# `tracing` to a crate that only formats a header (#4).
axum-extra = { version = "0.12", default-features = false, features = [
    "cookie",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# The binary is allowed to lose the error type at the boundary; libraries are not.
anyhow = "1.0"
thiserror = "2.0"
# Default features are off: they add the `any` driver, which would let a query be
# written against no particular database. `chrono` is not enabled -- one time type.
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
] }
uuid = { version = "1.26", features = ["v7", "serde"] }
# argon2id with the crate's defaults (m=19456, t=2, p=1 -- OWASP's minimum),
# stored as a PHC string, so the parameters travel with the hash and can be raised
# without a migration (#4).
argon2 = "0.6"
# 32 random bytes for a session token and, with #3, an invite token. Hex-encoded by
# hand: no encoding crate for 32 bytes (#4).
getrandom = "0.4"
# SHA-256 of a session or invite token, the stored lookup key. A fast hash is right
# here and argon2 is not: the token already carries 256 random bits, and the hash
# must be deterministic to find the row by it (#4).
sha2 = "0.11"
time = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Both of these compile, pass review, and then deadlock at runtime. They are the
# failures that produce no error message, so they are denied rather than warned.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_lines = "warn"
# Panics drop requests; production code must propagate failures instead of
# leaving unwrap, expect or panic calls as warnings that can be overlooked.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Debug and terminal output bypass tracing and can expose secrets, so none may
# remain in production code even when warnings are otherwise tolerated.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Exceptions must explain why and expire when unused, rather than silently
# weakening a production rule forever.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
