[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The package stays `app` in the workspace; the executable self-hosters run is
# `fukulow`, with `migrate` as a subcommand.
[[bin]]
name = "fukulow"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true }
domain = { workspace = true }
db = { workspace = true }
auth = { workspace = true }
realtime = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
rpassword = { workspace = true }

[dev-dependencies]
syn = { workspace = true }
# Reuse the database fixture helpers without writing SQL outside db.
uuid = { workspace = true }

# Not inherited automatically: a member that omits this table is silently
# unlinted while the workspace still looks configured.
[lints]
workspace = true
